<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Potato Guard</title>

```
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/profile.css') }}">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
```

</head>

<body>

<div class="profile-card">

```
<div class="profile-header">

    <div class="avatar">
        <i class="fa-solid fa-user"></i>
    </div>

    <h2>{{ user.name }}</h2>

    <p>{{ user.email }}</p>

</div>

<form action="{{ url_for('update_profile') }}" method="POST">

    <input
        type="text"
        name="name"
        value="{{ user.name }}"
        required>

    <input
        type="email"
        name="email"
        value="{{ user.email }}"
        required>

    <input
        type="text"
        name="address"
        value="{{ user.address }}"
        required>

    <button type="submit">
        Save Changes
    </button>

</form>

<a href="{{ url_for('logout') }}"
   class="logout-btn">

   Sign Out

</a>
```

</div>

</body>
</html>
